<style>
        .paper-shadow {
            box-shadow: 0 20px 40px rgba(94, 92, 230, 0.15),

                        0 0 0 1px rgba(94, 92, 230, 0.05) inset;

        .pill-input {
            background: theme('colors.surface-container-high');
            border: 2px solid transparent;
            color: theme('colors.reviseai-indigo');
            font-weight: 700;
            text-align: center;
            padding: 4px 12px;
            margin: 0 4px;
            border-radius: 9999px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .pill-input:hover, .pill-input:focus {
            outline: none;
            background: white;
            border-color: theme('colors.reviseai-cyan');
            box-shadow: 0 4px 12px rgba(100, 210, 255, 0.3);
            transform: translateY(-2px) scale(1.02);
            color: theme('colors.reviseai-indigo');
        }

            appearance: none;
            padding-right: 24px;

            background-repeat: no-repeat;

            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

        .btn-pressable:active {

        }
        .btn-pressable:hover {
            box-shadow: 0 10px 25px -5px rgba(94, 92, 230, 0.4);
            transform: translateY(-2px);
        }

        /* Animations */
        @keyframes slide-up-fade {
            0% { opacity: 0; transform: translateY(60px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        @keyframes float-medium {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }
        
        .animate-entrance {
            animation: slide-up-fade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .float-1 { animation: float-slow 6s ease-in-out infinite; }
        .float-2 { animation: float-medium 8s ease-in-out infinite reverse; }
        .float-3 { animation: float-slow 7s ease-in-out infinite 1s; }
        .float-4 { animation: float-medium 9s ease-in-out infinite 0.5s; }

<script>
    // Confetti effect on click
    document.getElementById('commitBtn').addEventListener('click', function() {
        const duration = 3000;
        const end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#5E5CE6', '#64D2FF', '#cb66fe']
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#5E5CE6', '#64D2FF', '#cb66fe']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
        
        // Change button text temporarily
        const originalText = this.innerHTML;
        this.innerHTML = "✨ Committed! Let's go! ✨";
        this.classList.add('bg-reviseai-cyan', 'text-reviseai-indigo');
        
        setTimeout(() => {
            this.innerHTML = originalText;
            this.classList.remove('bg-reviseai-cyan', 'text-reviseai-indigo');
        }, 3000);
    });

    // Auto-resize text inputs based on content
    document.querySelectorAll('.pill-input[type="text"]').forEach(input => {
        const resize = () => {
            // Very rough estimation for signature font width
            input.style.width = Math.max(100, (input.value.length * 15) + 30) + 'px';
        };
        input.addEventListener('input', resize);
        resize(); // Initial resize
    });
</script>
